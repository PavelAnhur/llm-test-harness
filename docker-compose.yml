services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: llm-tests-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API + dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  qdrant_data:
    name: llm-tests-qdrant-data
